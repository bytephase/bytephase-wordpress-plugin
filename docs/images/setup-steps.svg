<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Connecting WordPress to BytePhase in three steps: install the plugin from the WordPress directory, connect it with your web address, Store ID and API key, then map the form once inside BytePhase.">
  <title>Connecting WordPress to BytePhase — three steps</title>
  <defs>
    <style>
      .canvas   { fill: #f2f4f8; }
      .hdrbar   { fill: #191c2d; }
      .goldbar  { fill: #ffc700; }
      .hdrtxt   { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; fill: #ffffff; }
      .card     { fill: #ffffff; stroke: #e6e9ef; stroke-width: 1; }
      .toprule  { fill: #0056b2; }
      .toprulegold { fill: #ffc700; }
      .numbg    { fill: #e8f0fb; }
      .numbggold{ fill: #fdf1c9; }
      .numtxt   { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0056b2; }
      .numtxtg  { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .ctitle   { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .csub     { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #5c6072; }
      .cmono    { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0056b2; }
      .cmonosm  { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0056b2; }
      .time     { font: 700 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1a7f4b; }
      .chev     { stroke: #b6bfcc; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .bandttl  { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .bandsub  { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #5c6072; }
      .link     { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0056b2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1000" height="560"/>

  <!-- header -->
  <rect class="hdrbar"  x="0" y="0" width="1000" height="78"/>
  <rect class="goldbar" x="0" y="78" width="1000" height="6"/>
  <rect class="goldbar" x="40" y="26" width="6" height="28" rx="3"/>
  <text class="hdrtxt"  x="62" y="50">Connecting WordPress — three steps</text>

  <!-- card 1 -->
  <rect class="card"    x="40" y="124" width="285" height="248" rx="10"/>
  <rect class="toprule" x="40" y="124" width="285" height="4" rx="2"/>
  <circle class="numbg" cx="72" cy="164" r="18"/>
  <text class="numtxt"  x="72" y="170" text-anchor="middle">1</text>
  <text class="ctitle"  x="62" y="216">Install</text>
  <text class="csub"    x="62" y="244">In WordPress, open Plugins &#8594;</text>
  <text class="csub"    x="62" y="264">Add New and search for</text>
  <text class="csub"    x="62" y="284">&#8220;BytePhase Connector&#8221;.</text>
  <text class="csub"    x="62" y="304">Activate it. Or run:</text>
  <rect x="62" y="316" width="241" height="26" rx="5" fill="#eef2f8" stroke="#d7dfea" stroke-width="1"/>
  <text class="cmonosm" x="70" y="333">wp plugin install bytephase-connector</text>
  <text class="time"    x="62" y="358">about 1 minute</text>

  <path class="chev" d="M 339 244 l 8 8 l -8 8"/>

  <!-- card 2 -->
  <rect class="card"    x="358" y="124" width="285" height="248" rx="10"/>
  <rect class="toprule" x="358" y="124" width="285" height="4" rx="2"/>
  <circle class="numbg" cx="390" cy="164" r="18"/>
  <text class="numtxt"  x="390" y="170" text-anchor="middle">2</text>
  <text class="ctitle"  x="380" y="216">Connect</text>
  <text class="csub"    x="380" y="244">In BytePhase, go to Settings &#8594;</text>
  <text class="csub"    x="380" y="264">Integrations &#8594; Website Forms</text>
  <text class="csub"    x="380" y="284">to get your Store ID and key.</text>
  <text class="csub"    x="380" y="312">Paste both into BytePhase &#8594;</text>
  <text class="csub"    x="380" y="332">Connection, then Test Connection.</text>
  <text class="time"    x="380" y="358">about 2 minutes</text>

  <path class="chev" d="M 657 244 l 8 8 l -8 8"/>

  <!-- card 3 (gold) -->
  <rect class="card"        x="675" y="124" width="285" height="248" rx="10"/>
  <rect class="toprulegold" x="675" y="124" width="285" height="4" rx="2"/>
  <circle class="numbggold" cx="707" cy="164" r="18"/>
  <text class="numtxtg"     x="707" y="170" text-anchor="middle">3</text>
  <text class="ctitle"      x="697" y="216">Map the form</text>
  <text class="csub"        x="697" y="244">Add your own form, or drop</text>
  <text class="csub"        x="697" y="264">this shortcode on a page:</text>
  <rect x="697" y="276" width="192" height="26" rx="5" fill="#eef2f8" stroke="#d7dfea" stroke-width="1"/>
  <text class="cmono"       x="709" y="293">[bytephase_lead_form]</text>
  <text class="csub"        x="697" y="322">Match its fields once inside</text>
  <text class="csub"        x="697" y="342">BytePhase. Then submit a test.</text>
  <text class="time"        x="697" y="362">about 2 minutes</text>

  <!-- result band -->
  <rect x="40" y="404" width="920" height="72" rx="10" fill="#ffffff" stroke="#e6e9ef" stroke-width="1"/>
  <rect x="40" y="404" width="6" height="72" rx="3" fill="#1a7f4b"/>
  <circle cx="82" cy="440" r="16" fill="#e7f6ee"/>
  <path d="M 75 440 l 5 5 l 10 -11" fill="none" stroke="#1a7f4b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="bandttl" x="112" y="435">Connected — website enquiries now arrive as jobs</text>
  <text class="bandsub" x="112" y="457">The built-in shortcodes work the moment you connect. Step 3 is only needed for your own forms.</text>

  <!-- footer link -->
  <text class="bandsub" x="500" y="512" text-anchor="middle">Full walkthrough with screenshots:</text>
  <text class="link"    x="500" y="534" text-anchor="middle">bytephase.com/integrations/wordpress</text>
</svg>
