<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="How your form fields become a BytePhase lead: you name fields whatever you like on your WordPress form, and inside BytePhase you match each one to a BytePhase field, once per form.">
  <title>How your form fields become a BytePhase lead</title>
  <defs>
    <style>
      .canvas  { fill: #f2f4f8; }
      .hdrbar  { fill: #191c2d; }
      .goldbar { fill: #ffc700; }
      .hdrtxt  { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; fill: #ffffff; }
      .colhdr  { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0056b2; letter-spacing: .12em; }
      .lcard   { fill: #ffffff; stroke: #e0e5ee; stroke-width: 1; }
      .rcard   { fill: #f8f5f2; stroke: #ece4da; stroke-width: 1; }
      .rbar    { fill: #0056b2; }
      .ltxt    { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #25242c; }
      .rtxt    { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .tri     { fill: #ffc700; }
      .band    { fill: #191c2d; }
      .bandttl { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffc700; }
      .sub     { fill: #2f304a; }
      .subttl  { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
      .subtxt  { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #c3c6d4; }
      .foot    { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #5c6072; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1000" height="600"/>

  <!-- header -->
  <rect class="hdrbar"  x="0" y="0" width="1000" height="78"/>
  <rect class="goldbar" x="0" y="78" width="1000" height="6"/>
  <text class="hdrtxt"  x="500" y="50" text-anchor="middle">How your form fields become a lead</text>

  <!-- column headers -->
  <text class="colhdr" x="245" y="118" text-anchor="middle">ON YOUR WORDPRESS FORM</text>
  <text class="colhdr" x="755" y="118" text-anchor="middle">IN BYTEPHASE</text>

  <!-- row 1 -->
  <rect class="lcard" x="60" y="138" width="370" height="52" rx="8"/>
  <text class="ltxt"  x="82" y="170">Your Name</text>
  <path class="tri"   d="M 476 155 l 26 9 l -26 9 z"/>
  <rect class="rcard" x="570" y="138" width="370" height="52" rx="8"/>
  <rect class="rbar"  x="570" y="138" width="5" height="52" rx="2.5"/>
  <text class="rtxt"  x="596" y="170">Lead name</text>

  <!-- row 2 -->
  <rect class="lcard" x="60" y="202" width="370" height="52" rx="8"/>
  <text class="ltxt"  x="82" y="234">Phone (WhatsApp)</text>
  <path class="tri"   d="M 476 219 l 26 9 l -26 9 z"/>
  <rect class="rcard" x="570" y="202" width="370" height="52" rx="8"/>
  <rect class="rbar"  x="570" y="202" width="5" height="52" rx="2.5"/>
  <text class="rtxt"  x="596" y="234">Mobile number</text>

  <!-- row 3 -->
  <rect class="lcard" x="60" y="266" width="370" height="52" rx="8"/>
  <text class="ltxt"  x="82" y="298">email_addr</text>
  <path class="tri"   d="M 476 283 l 26 9 l -26 9 z"/>
  <rect class="rcard" x="570" y="266" width="370" height="52" rx="8"/>
  <rect class="rbar"  x="570" y="266" width="5" height="52" rx="2.5"/>
  <text class="rtxt"  x="596" y="298">Email</text>

  <!-- row 4 -->
  <rect class="lcard" x="60" y="330" width="370" height="52" rx="8"/>
  <text class="ltxt"  x="82" y="362">What&#8217;s wrong with it?</text>
  <path class="tri"   d="M 476 347 l 26 9 l -26 9 z"/>
  <rect class="rcard" x="570" y="330" width="370" height="52" rx="8"/>
  <rect class="rbar"  x="570" y="330" width="5" height="52" rx="2.5"/>
  <text class="rtxt"  x="596" y="362">Comment</text>

  <!-- caption between the columns -->
  <text class="foot" x="500" y="404" text-anchor="middle">You match each field once, inside BytePhase. The plugin sends them exactly as typed.</text>

  <!-- bottom band -->
  <rect class="band"    x="60" y="424" width="880" height="140" rx="10"/>
  <rect class="goldbar" x="60" y="424" width="8" height="140" rx="4"/>
  <text class="bandttl" x="500" y="458" text-anchor="middle">The one rule — what your form has to collect</text>

  <rect class="sub" x="96" y="478" width="262" height="66" rx="8"/>
  <text class="subttl" x="227" y="506" text-anchor="middle">A name</text>
  <text class="subtxt" x="227" y="528" text-anchor="middle">Always required</text>

  <rect class="sub" x="374" y="478" width="262" height="66" rx="8"/>
  <text class="subttl" x="505" y="506" text-anchor="middle">Email or phone</text>
  <text class="subtxt" x="505" y="528" text-anchor="middle">At least one of the two</text>

  <rect class="sub" x="652" y="478" width="262" height="66" rx="8"/>
  <text class="subttl" x="783" y="506" text-anchor="middle">Everything else</text>
  <text class="subtxt" x="783" y="528" text-anchor="middle">Optional — map what you need</text>
</svg>
