<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="How a website enquiry becomes a BytePhase job in four steps: a visitor submits a form, the plugin captures the fields as typed, they are sent over one authenticated HTTPS call, and BytePhase maps them and creates a lead or self check-in.">
  <title>How a website enquiry becomes a BytePhase job</title>
  <defs>
    <style>
      .canvas   { fill: #f2f4f8; }
      .hdrbar   { fill: #191c2d; }
      .goldbar  { fill: #ffc700; }
      .hdrtxt   { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; fill: #ffffff; }
      .card     { fill: #ffffff; stroke: #e6e9ef; stroke-width: 1; }
      .toprule  { fill: #0056b2; }
      .toprulegold { fill: #ffc700; }
      .numbg    { fill: #e8f0fb; }
      .numbggold{ fill: #fdf1c9; }
      .numtxt   { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0056b2; }
      .numtxtg  { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .ctitle   { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .csub     { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #5c6072; }
      .cmono    { font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0056b2; }
      .bandttl  { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .bandsub  { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #5c6072; }
      .notettl  { font: 700 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #191c2d; }
      .notesub  { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #5c6072; }
      .ln       { stroke: #cfd6e0; stroke-width: 2; fill: none; }
      .lnw      { stroke: #ffffff; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .chev     { stroke: #b6bfcc; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1000" height="600"/>

  <!-- header -->
  <rect class="hdrbar"  x="0" y="0" width="1000" height="78"/>
  <rect class="goldbar" x="0" y="78" width="1000" height="6"/>
  <rect class="goldbar" x="40" y="26" width="6" height="28" rx="3"/>
  <text class="hdrtxt"  x="62" y="50">How a website enquiry becomes a job</text>

  <!-- ============ card 1 ============ -->
  <rect class="card"    x="40" y="124" width="200" height="252" rx="10"/>
  <rect class="toprule" x="40" y="124" width="200" height="4" rx="2"/>
  <circle class="numbg" cx="72" cy="164" r="18"/>
  <text class="numtxt"  x="72" y="170" text-anchor="middle">1</text>
  <text class="ctitle"  x="62" y="216">Visitor submits</text>
  <text class="csub"    x="62" y="240">A form on your</text>
  <text class="csub"    x="62" y="258">WordPress site.</text>
  <text class="csub"    x="62" y="282">Contact Form 7,</text>
  <text class="csub"    x="62" y="300">Elementor, or the</text>
  <text class="csub"    x="62" y="318">built-in shortcode.</text>
  <!-- icon: browser with form rows -->
  <rect x="62" y="334" width="86" height="26" rx="5" fill="#eef2f8" stroke="#d7dfea" stroke-width="1"/>
  <circle cx="70" cy="341" r="2" fill="#b6bfcc"/><circle cx="77" cy="341" r="2" fill="#b6bfcc"/>
  <rect x="68" y="347" width="44" height="3" rx="1.5" fill="#c3cbd8"/>
  <rect x="68" y="353" width="30" height="3" rx="1.5" fill="#c3cbd8"/>

  <path class="chev" d="M 254 246 l 8 8 l -8 8"/>

  <!-- ============ card 2 ============ -->
  <rect class="card"    x="280" y="124" width="200" height="252" rx="10"/>
  <rect class="toprule" x="280" y="124" width="200" height="4" rx="2"/>
  <circle class="numbg" cx="312" cy="164" r="18"/>
  <text class="numtxt"  x="312" y="170" text-anchor="middle">2</text>
  <text class="ctitle"  x="302" y="216">Plugin captures</text>
  <text class="csub"    x="302" y="240">The fields exactly</text>
  <text class="csub"    x="302" y="258">as they were typed,</text>
  <text class="csub"    x="302" y="276">plus an id for the</text>
  <text class="csub"    x="302" y="294">form:</text>
  <text class="cmono"   x="302" y="316">form_id</text>
  <text class="csub"    x="302" y="352">No renaming here.</text>

  <path class="chev" d="M 494 246 l 8 8 l -8 8"/>

  <!-- ============ card 3 ============ -->
  <rect class="card"    x="520" y="124" width="200" height="252" rx="10"/>
  <rect class="toprule" x="520" y="124" width="200" height="4" rx="2"/>
  <circle class="numbg" cx="552" cy="164" r="18"/>
  <text class="numtxt"  x="552" y="170" text-anchor="middle">3</text>
  <text class="ctitle"  x="542" y="216">Sent securely</text>
  <text class="csub"    x="542" y="240">One HTTPS call to</text>
  <text class="csub"    x="542" y="258">your account, with</text>
  <text class="csub"    x="542" y="276">your key and the</text>
  <text class="csub"    x="542" y="294">certificate checked.</text>
  <!-- icon: padlock -->
  <rect x="542" y="322" width="26" height="20" rx="4" fill="#191c2d"/>
  <path d="M 548 322 v -6 a 7 7 0 0 1 14 0 v 6" fill="none" stroke="#191c2d" stroke-width="3"/>
  <circle cx="555" cy="332" r="3" fill="#ffc700"/>
  <text class="csub"    x="576" y="337">nothing stored</text>

  <path class="chev" d="M 734 246 l 8 8 l -8 8"/>

  <!-- ============ card 4 (gold) ============ -->
  <rect class="card"       x="760" y="124" width="200" height="252" rx="10"/>
  <rect class="toprulegold"   x="760" y="124" width="200" height="4" rx="2"/>
  <circle class="numbggold" cx="792" cy="164" r="18"/>
  <text class="numtxtg"    x="792" y="170" text-anchor="middle">4</text>
  <text class="ctitle"     x="782" y="216">Job created</text>
  <text class="csub"       x="782" y="240">BytePhase matches</text>
  <text class="csub"       x="782" y="258">the fields for that</text>
  <text class="csub"       x="782" y="276">form and creates a</text>
  <text class="csub"       x="782" y="294">lead or a self</text>
  <text class="csub"       x="782" y="312">check-in.</text>
  <!-- icon: job card with check -->
  <rect x="782" y="330" width="34" height="30" rx="5" fill="#191c2d"/>
  <rect x="788" y="338" width="22" height="3" rx="1.5" fill="#8f94a8"/>
  <rect x="788" y="345" width="16" height="3" rx="1.5" fill="#8f94a8"/>
  <path class="lnw" d="M 789 354 l 4 4 l 8 -9"/>
  <circle cx="826" cy="345" r="9" fill="#e7f6ee"/>
  <path d="M 822 345 l 3 3 l 6 -7" fill="none" stroke="#1a7f4b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ result band ============ -->
  <rect x="40" y="410" width="920" height="72" rx="10" fill="#ffffff" stroke="#e6e9ef" stroke-width="1"/>
  <rect x="40" y="410" width="6" height="72" rx="3" fill="#1a7f4b"/>
  <circle cx="82" cy="446" r="16" fill="#e7f6ee"/>
  <path d="M 75 446 l 5 5 l 10 -11" fill="none" stroke="#1a7f4b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="bandttl" x="112" y="441">Nothing is lost if BytePhase cannot be reached</text>
  <text class="bandsub" x="112" y="463">The submission is queued and retried in the background. The Health screen shows every delivery.</text>

  <!-- ============ note band ============ -->
  <rect x="40" y="500" width="920" height="62" rx="10" fill="#f8f5f2" stroke="#eee6da" stroke-width="1"/>
  <rect x="40" y="500" width="6" height="62" rx="3" fill="#ffc700"/>
  <text class="notettl" x="70" y="527">The plugin stores no customer records</text>
  <text class="notesub" x="70" y="548">Mapping, duplicate detection, assignment and notifications all happen inside BytePhase.</text>
</svg>
